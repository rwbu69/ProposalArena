<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena - Spatial Grayscale</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Bricolage Grotesque: Unique character, highly readable, not generic -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Bricolage Grotesque"', "sans-serif"],
            },
            colors: {
              // Soft, low-contrast grayscale palette
              space: {
                left: "#121212",
                right: "#1a1a1a",
                textMuted: "#7a7a7a",
                textSoft: "#b3b3b3",
                textHighlight: "#e6e6e6",
                active: "#242424",
              },
            },
          },
        },
      };
    </script>

    <style>
      body {
        background-color: #121212;
        color: #b3b3b3;
        margin: 0;
        overflow: hidden; /* Lock scroll, app-like feel */
        -webkit-font-smoothing: antialiased;
      }

      /* 
           Unconventional Dropzone:
           The entire right panel is the dropzone. No bounding boxes. 
        */
      .canvas-dropzone {
        transition:
          background-color 0.4s ease,
          border-color 0.4s ease;
        position: relative;
      }

      /* Interactive states for the massive dropzone */
      .canvas-dropzone.dragover {
        background-color: #242424;
      }

      .canvas-dropzone:hover .crosshair {
        transform: scale(1.5) rotate(90deg);
        opacity: 1;
      }

      .crosshair {
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 0.5;
      }

      /* Subtle animated noise texture to give the right panel physical depth without being loud */
      .noise-bg {
        position: absolute;
        inset: 0;
        opacity: 0.03;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
    </style>
  </head>

  <body
    class="font-sans font-light h-screen w-screen flex flex-col lg:flex-row"
  >
    <!-- LEFT PANEL: 40% width. Spatial typography, pushed to corners. -->
    <div
      class="w-full lg:w-[40%] h-full bg-space-left flex flex-col justify-between p-8 lg:p-12 border-b lg:border-b-0 lg:border-r border-[#222]"
    >
      <!-- Top Section: Minimalist Nav -->
      <div class="flex justify-end items-start w-full">
        <div class="flex gap-4">
          <button
            class="text-space-textMuted hover:text-space-textHighlight transition-colors text-sm"
          >
            ID
          </button>
          <button
            class="text-space-textMuted hover:text-space-textHighlight transition-colors"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              ></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Bottom Section: Title and context pushed to the bottom left -->
      <div class="mb-4">
        <h1
          class="text-4xl md:text-5xl lg:text-[4rem] leading-none font-medium text-space-textHighlight tracking-tight mb-6"
        >
          Arena <br />
          <span class="text-space-textSoft">Proposal.</span>
        </h1>

        <p
          class="text-space-textMuted text-base md:text-lg max-w-sm leading-relaxed font-light"
        >
          Konfigurasikan asisten penguji untuk simulasi sidang Anda.
        </p>
      </div>
    </div>

    <!-- RIGHT PANEL: 60% width. The entire panel is the upload zone. -->
    <div
      id="dropzoneCanvas"
      class="canvas-dropzone w-full lg:w-[60%] h-full bg-space-right cursor-pointer flex flex-col items-center justify-center relative group"
    >
      <div class="noise-bg"></div>

      <!-- Minimalist center focal point instead of a giant box -->
      <div
        class="crosshair text-space-textMuted flex items-center justify-center w-16 h-16 rounded-full border border-[#333] group-hover:border-space-textSoft group-hover:text-space-textHighlight"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1"
        >
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </div>

      <!-- Subtle instruction placed at the very bottom of the canvas -->
      <div
        class="absolute bottom-8 lg:bottom-12 left-0 w-full text-center px-6"
      >
        <p id="statusText" class="text-space-textMuted text-sm tracking-wide">
          Klik area ini untuk memilih dokumen, atau jatuhkan file di mana saja.
        </p>
        <p class="text-[#555] text-xs mt-2 font-medium">
          PDF & TXT (Maks 10MB)
        </p>
      </div>

      <input
        type="file"
        id="hiddenFileInput"
        class="hidden"
        accept=".pdf,.txt"
      />
    </div>

    <script>
      const canvas = document.getElementById("dropzoneCanvas");
      const fileInput = document.getElementById("hiddenFileInput");
      const statusText = document.getElementById("statusText");
      const crosshair = document.querySelector(".crosshair");

      // Click anywhere on the right panel to trigger upload
      canvas.addEventListener("click", () => {
        fileInput.click();
      });

      // Drag and drop logic for the entire panel
      ["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
        canvas.addEventListener(eventName, preventDefaults, false);
        document.body.addEventListener(eventName, preventDefaults, false);
      });

      function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
      }

      ["dragenter", "dragover"].forEach((eventName) => {
        canvas.addEventListener(
          eventName,
          () => {
            canvas.classList.add("dragover");
            crosshair.style.transform = "scale(1.5) rotate(90deg)";
            crosshair.style.opacity = "1";
            statusText.innerText = "Lepaskan file sekarang...";
            statusText.style.color = "#e6e6e6";
          },
          false,
        );
      });

      ["dragleave", "drop"].forEach((eventName) => {
        canvas.addEventListener(
          eventName,
          () => {
            canvas.classList.remove("dragover");
            crosshair.style.transform = "";
            crosshair.style.opacity = "";
            statusText.innerText =
              "Klik area ini untuk memilih dokumen, atau jatuhkan file di mana saja.";
            statusText.style.color = "";
          },
          false,
        );
      });

      canvas.addEventListener("drop", (e) => {
        let dt = e.dataTransfer;
        let files = dt.files;
        handleFiles(files);
      });

      fileInput.addEventListener("change", function () {
        handleFiles(this.files);
      });

      function handleFiles(files) {
        if (files.length > 0) {
          const file = files[0];
          const validTypes = ["application/pdf", "text/plain"];

          if (validTypes.includes(file.type)) {
            // Unconventional processing animation
            crosshair.innerHTML = `<svg class="animate-spin" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>`;
            statusText.innerText = `Membaca ${file.name}...`;

            setTimeout(() => {
              crosshair.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
              statusText.innerText = "Dokumen berhasil dimuat.";
              statusText.style.color = "#e6e6e6";

              setTimeout(() => {
                // Reset
                crosshair.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>`;
                statusText.innerText =
                  "Klik area ini untuk memilih dokumen, atau jatuhkan file di mana saja.";
                statusText.style.color = "";
              }, 2500);
            }, 1200);
          }
        }
      }
    </script>
  </body>
</html>
